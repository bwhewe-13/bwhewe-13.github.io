<header class="sidebar">
  <a class="identity" href="/">
    <img class="identity-photo" src="/figures/linkedin_profile.jpg" alt="" width="112" height="112">
    <span class="identity-text">
      <span class="identity-name">Ben Whewell</span>
      <span class="identity-role">{{ site.role }}</span>
      <span class="identity-location">{% include icons/location.svg %}{{ site.location }}</span>
    </span>
  </a>

  <nav class="site-nav" aria-label="Main">
    <ul>
      {%- for item in site.data.nav %}
      <li><a href="{{ item.url }}"{% if page.url == item.url or page.nav == item.title %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
      {%- endfor %}
    </ul>
  </nav>

  <div class="sidebar-contact">
    {% include contact-links.html %}
  </div>
</header>
